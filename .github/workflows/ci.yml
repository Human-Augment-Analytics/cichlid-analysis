name: CI

on:
  push:
    branches: [main]
  pull_request:
    # The default types (opened, synchronize, reopened) rerun CI on new commits. `edited` also
    # reruns it when the title, description or base branch changes; `ready_for_review` when a
    # draft is marked ready.
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

# A newer run for the same PR cancels its older run still in progress. Runs on main are not
# cancelled, so every merged commit is checked.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11.6"

      - name: Lockfile matches pyproject.toml
        run: uv lock --check

      - name: Lint (unused imports, syntax errors)
        run: uvx ruff@0.14.0 check .

      - name: Conflict markers, duplicated docs, committed/ignored claims
        run: python scripts/check_repo.py

      - name: Repository regression tests
        run: uv run --no-project --with pytest pytest tests/test_repo_checks.py -v
