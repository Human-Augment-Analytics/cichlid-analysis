[project]
name = "courtship-analysis"
version = "0.1.0"
description = "Cichlid courtship feature extraction, behavior detection, and evaluation"
readme = "README.md"
authors = [
    { name = "Ding YuChen", email = "hi@ding.gg" },
    { name = "Rijan Ghimire", email = "work@rijan.dev" }
]
requires-python = "==3.11.6"
dependencies = [
    "altair",
    "imageio-ffmpeg>=0.6.0",
    "joblib>=1.6.0",
    "marimo>=0.25.1",
    "matplotlib>=3.11.2",
    "numpy<=2.5.2",
    "opencv-python>=5.0.0.93",
    "opencv-python-headless",
    "pandas>=2.2",
    "polars",
    "pyarrow>=15",
    "scikit-learn>=1.9.1",
    "tqdm>=4.65.0",
    "dlc2action>=1.0",
    "python-dotenv>=1.0.0",
    "xgboost>=3.2,<4",
]

[tool.marimo.runtime]
output_max_bytes = 20_000_000

[tool.ruff]
extend-exclude = ["models/actionformer/vendor"]  # upstream ActionFormer code, kept as published

[tool.ruff.lint]
# Unused imports, plus the syntax errors ruff always reports (e.g. merge-conflict markers in .py files).
select = ["F401"]
